<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Customer Support AI Agent - Architecture</title>
<style>
  html,body{margin:0;background:#fff;font-family:"Segoe UI",Arial,sans-serif}
  svg{display:block}
  .lbl{font-size:15px;font-weight:600;fill:#232f3e;text-anchor:middle}
  .sub{font-size:12px;fill:#5f6b7a;text-anchor:middle}
  .grp{font-size:14px;font-weight:700}
  .edge{stroke:#232f3e;stroke-width:2.2;fill:none;marker-end:url(#arr)}
  .bus{stroke:#232f3e;stroke-width:2.2;fill:none}
  .num{fill:#232f3e}
  .numt{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}
  .glyph{fill:#fff;font-weight:700;text-anchor:middle;font-size:26px}
</style>
</head>
<body>
<svg id="d" width="1600" height="1040" viewBox="0 0 1600 1040" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker>
  </defs>
  <rect width="1600" height="1040" fill="#fff"/>
  <text x="800" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#232f3e">Customer Support AI Agent — Amazon Bedrock AgentCore Architecture</text>

  <rect x="250" y="70" width="1330" height="950" rx="6" fill="none" stroke="#232f3e" stroke-width="2"/>
  <rect x="250" y="70" width="44" height="44" fill="#232f3e"/>
  <text x="272" y="98" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">AWS</text>
  <text x="304" y="98" class="grp" fill="#232f3e">AWS Cloud</text>
  <rect x="270" y="125" width="1290" height="875" rx="6" fill="none" stroke="#00a4a6" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="285" y="148" class="grp" fill="#00a4a6">Region: us-east-1</text>

  <rect x="690" y="165" width="850" height="248" rx="6" fill="#faf5ff" stroke="#8c4fff" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="705" y="187" class="grp" fill="#8c4fff">AgentCore Gateway — MCP tools</text>
  <rect x="690" y="428" width="850" height="150" rx="6" fill="#f2fbf4" stroke="#3f8624" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="705" y="450" class="grp" fill="#3f8624">Retrieval-Augmented Generation (RAG)</text>

  <g id="edges"></g>
  <g id="nodes"></g>
</svg>
<script>
const NS="http://www.w3.org/2000/svg";
const nodes=document.getElementById("nodes"), edges=document.getElementById("edges");
const COL={ml:"#01a88d",compute:"#ed7100",app:"#e7157b",db:"#8c4fff",storage:"#3f8624",user:"#232f3e",net:"#5a6c86"};
function node(cx,cy,color,glyph,label,sub,size=72){
  const g=document.createElementNS(NS,"g");
  const x=cx-size/2,y=cy-size/2;
  const icon = glyph.startsWith("img:")
    ? `<image href="icons/${glyph.slice(4)}.png" x="${x}" y="${y}" width="${size}" height="${size}"/>`
    : `<rect x="${x}" y="${y}" width="${size}" height="${size}" rx="8" fill="${color}"/><text x="${cx}" y="${cy+9}" class="glyph" style="font-size:${glyph.length>2?18:26}px">${glyph}</text>`;
  g.innerHTML=`${icon}
  <text x="${cx}" y="${y+size+20}" class="lbl">${label}</text>
  <text x="${cx}" y="${y+size+37}" class="sub">${sub||""}</text>`;
  nodes.appendChild(g); return {cx,cy,l:x,r:x+size,t:y,b:y+size};
}
function path(d,cls){const p=document.createElementNS(NS,"path");p.setAttribute("d",d);p.setAttribute("class",cls||"edge");edges.appendChild(p);}
function badge(x,y,n){nodes.insertAdjacentHTML("beforeend",`<circle cx="${x}" cy="${y}" r="12" class="num"/><text x="${x}" y="${y+5}" class="numt">${n}</text>`);}

const midY=560;
const user=node(125,midY,COL.user,"img:user","Customer","Chat / API invoke");
const rt=node(450,midY,COL.ml,"img:bedrock","AgentCore Runtime","Strands Agent · main.py",100);
const nova=node(450,330,COL.ml,"img:bedrock","Amazon Bedrock","Nova 2 Lite (LLM)");

const gw=node(790,225,COL.app,"img:bedrock","AgentCore Gateway","MCP endpoint");
const apig=node(1070,225,COL.app,"img:apigw","Amazon API Gateway","CustomerSupportOrderAPI");
const l1=node(1380,225,COL.compute,"img:lambda","order-tracker","AWS Lambda",64);
const l2=node(1380,335,COL.compute,"img:lambda","refund-processor","AWS Lambda (direct target)",64);

const kb=node(790,495,COL.ml,"img:bedrock","Bedrock Knowledge Base","search_knowledge_base tool");
const os=node(1070,495,COL.db,"img:opensearch","OpenSearch Serverless","vector store");
const s3=node(1380,495,COL.storage,"img:s3","Amazon S3","product_catalog.txt");

const mem=node(790,660,COL.db,"img:bedrock","AgentCore Memory","MemoryHook · facts + preferences");
const ci=node(790,790,COL.compute,"img:bedrock","AgentCore Code Interpreter","calculate_loyalty_discount");
const br=node(790,925,COL.net,"img:bedrock","AgentCore Browser","managed Chrome (Playwright)",56);
const web=node(1070,925,COL.user,"www","Live web page","udacity.com",56);

// user -> runtime
path(`M${user.r},${midY} L${rt.l-4},${midY}`);
badge((user.r+rt.l)/2,midY-20,1);
// runtime -> nova
path(`M${rt.cx},${rt.t} L${rt.cx},${nova.b+44}`);
badge(rt.cx+22,(rt.t+nova.b+44)/2,2);
// bus
const busX=620;
path(`M${rt.r},${midY} L${busX},${midY}`,"bus");
path(`M${busX},${gw.cy} L${busX},${br.cy}`,"bus");
[gw,kb,mem,ci,br].forEach(n=>path(`M${busX},${n.cy} L${n.l-4},${n.cy}`));
// gateway targets
path(`M${gw.r},${gw.cy} L${apig.l-4},${apig.cy}`);
path(`M${apig.r},${apig.cy} L${l1.l-4},${l1.cy}`);
path(`M${gw.r+70},${gw.cy} L${gw.r+70},${l2.cy} L${l2.l-4},${l2.cy}`);
badge(gw.r+16,gw.cy-18,3);
// RAG
path(`M${kb.r},${kb.cy} L${os.l-4},${os.cy}`);
path(`M${os.r},${os.cy} L${s3.l-4},${s3.cy}`);
badge(kb.r+16,kb.cy-18,4);
badge(mem.l-26,mem.cy-18,5);
badge(ci.l-26,ci.cy-18,6);
path(`M${br.r},${br.cy} L${web.l-4},${web.cy}`);
badge(br.l-26,br.cy-18,7);

// legend
const legend=document.createElementNS(NS,"g");
const L=["1  Customer sends prompt + customer_id + session_id to the runtime",
"2  Agent (Strands) reasons with Amazon Nova and selects a tool",
"3  Gateway (MCP) → API Gateway → Lambda (orders) / Lambda (refunds)",
"4  Knowledge Base → OpenSearch Serverless over the S3 catalog (RAG)",
"5  MemoryHook recalls context before and saves the turn after each reply",
"6  Code Interpreter runs loyalty maths (tier-only fallback if unavailable)",
"7  Browser tool reads live web pages"];
legend.innerHTML=`<rect x="1130" y="620" width="410" height="250" rx="6" fill="#f7f8fa" stroke="#d5dbdb"/>
<text x="1148" y="648" class="grp" fill="#232f3e">Request flow</text>`+
L.map((t,i)=>`<text x="1148" y="${676+i*27}" font-size="12.5" fill="#232f3e">${t}</text>`).join("");
document.getElementById("d").appendChild(legend);
</script>
</body>
</html>
